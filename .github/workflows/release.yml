name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version from tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo 'Use a version tag like v1.0.0.' >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( major > 2099 || minor > 999 || patch > 999 )); then
            echo 'Version components exceed Android versionCode limits.' >&2
            exit 1
          fi
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 1 )); then exit 1; fi
          echo "VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check translations
        run: python3 scripts/check-localizations.py
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build signed release
        env:
          SPACE_KEYSTORE_BASE64: ${{ secrets.SPACE_KEYSTORE_BASE64 }}
          SPACE_KEYSTORE_PASSWORD: ${{ secrets.SPACE_KEYSTORE_PASSWORD }}
          SPACE_KEY_ALIAS: ${{ secrets.SPACE_KEY_ALIAS }}
          SPACE_KEY_PASSWORD: ${{ secrets.SPACE_KEY_PASSWORD }}
          SPACE_KEYSTORE_PATH: ${{ runner.temp }}/space-release.jks
          SPACE_APP_CERT_SHA256: ${{ vars.SPACE_APP_CERT_SHA256 }}
        run: |
          for key in SPACE_KEYSTORE_BASE64 SPACE_KEYSTORE_PASSWORD SPACE_KEY_ALIAS SPACE_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "Missing GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          trap 'rm -f "$SPACE_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$SPACE_KEYSTORE_BASE64" | base64 --decode > "$SPACE_KEYSTORE_PATH"
          bash ./gradlew --no-daemon --stacktrace :app:check :app:assembleRelease :app:bundleRelease \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          if [[ -z "$SPACE_APP_CERT_SHA256" ]]; then
            echo 'Set repository variable SPACE_APP_CERT_SHA256 to the expected app-signing certificate.' >&2
            exit 1
          fi
          python3 scripts/check-store-package.py src/app/build/outputs/apk/release/app-release.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" --expected-cert "$SPACE_APP_CERT_SHA256" \
            --report dist/package-check.json
          cp -R docs/store-kit dist/store-kit
          cp src/app/build/outputs/apk/release/app-release.apk "dist/Space-$VERSION_NAME.apk"
          cp src/app/build/outputs/bundle/release/app-release.aab "dist/Space-$VERSION_NAME.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Space-${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          if refs=$(git ls-remote --exit-code origin "$tag_ref" "$tag_ref^{}"); then
            # Prefer the commit pointed to by an annotated tag.
            tagged_commit=$(awk '{ print $1 }' <<< "$refs" | tail -n 1)
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to a different commit." >&2
              exit 1
            fi
          else
            status=$?
            if (( status != 2 )); then exit "$status"; fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="$tag_ref" -f sha="$GITHUB_SHA" --silent
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("dist/Space-$VERSION_NAME.apk" "dist/Space-$VERSION_NAME.aab" dist/SHA256SUMS.txt dist/package-check.json)
          if is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [[ "$is_draft" == true ]]; then
              gh release edit "$RELEASE_TAG" --draft=false --verify-tag --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --generate-notes \
              --title "Space $VERSION_NAME" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-reports
          path: src/app/build/reports/
          if-no-files-found: ignore
