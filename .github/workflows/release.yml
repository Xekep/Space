name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check translations
        run: python3 scripts/check-localizations.py
      - name: Read version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo 'Use a version tag like v1.0.0.' >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( major > 2099 || minor > 999 || patch > 999 )); then
            echo 'Version components exceed Android versionCode limits.' >&2
            exit 1
          fi
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 1 )); then exit 1; fi
          echo "VERSION_NAME=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build signed release
        env:
          SPACE_KEYSTORE_BASE64: ${{ secrets.SPACE_KEYSTORE_BASE64 }}
          SPACE_KEYSTORE_PASSWORD: ${{ secrets.SPACE_KEYSTORE_PASSWORD }}
          SPACE_KEY_ALIAS: ${{ secrets.SPACE_KEY_ALIAS }}
          SPACE_KEY_PASSWORD: ${{ secrets.SPACE_KEY_PASSWORD }}
          SPACE_KEYSTORE_PATH: ${{ runner.temp }}/space-release.jks
        run: |
          for key in SPACE_KEYSTORE_BASE64 SPACE_KEYSTORE_PASSWORD SPACE_KEY_ALIAS SPACE_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "Missing GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          trap 'rm -f "$SPACE_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$SPACE_KEYSTORE_BASE64" | base64 --decode > "$SPACE_KEYSTORE_PATH"
          bash ./gradlew --no-daemon --stacktrace :app:check :app:assembleRelease :app:bundleRelease \
            -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
          mkdir -p dist
          cp src/app/build/outputs/apk/release/app-release.apk "dist/Space-$VERSION_NAME.apk"
          cp src/app/build/outputs/bundle/release/app-release.aab "dist/Space-$VERSION_NAME.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Space-${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
              --title "Space $VERSION_NAME" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-reports
          path: src/app/build/reports/
          if-no-files-found: ignore
