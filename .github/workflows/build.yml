name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: |
          cli="$ANDROID_HOME/cmdline-tools/latest/bin/android"
          if [[ -x "$cli" ]]; then
            "$cli" --no-metrics sdk install 'platforms;android-35' 'build-tools;35.0.0'
          else
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Check and build
        run: |
          python3 scripts/check-localizations.py
          bash ./gradlew --no-daemon --stacktrace :app:check :app:assembleDebug :app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Space-debug
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: src/app/build/reports/
          if-no-files-found: ignore
